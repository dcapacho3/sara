twist_mux:
  ros__parameters:
    # This twist_mux release defaults use_stamped to true (TwistStamped on
    # every input/output topic). Every publisher and subscriber in this
    # repo (speed_limit.py, naive_obstacle_avoidance.py, joy_teleop.py,
    # Nav2's controller_server, ...) uses plain Twist, so without this the
    # type mismatch means messages never actually connect.
    use_stamped: false
    topics:
      navigation:
        topic   : cmd_vel
        timeout : 0.5
        priority: 50
      keyboard:
        topic   : cmd_vel_key
        timeout : 0.5
        priority: 100
      avoidance:
        topic   : cmd_vel_avoidance
        timeout : 0.5
        priority: 200
      gamepad:
        topic   : cmd_vel_gamepad
        timeout : 0.5
        priority: 100
      block_all:
        topic   : cmd_vel_block_all
        timeout : 0.5
        priority: 255
      block_nav:
        topic   : cmd_vel_block_navigation
        timeout : 0.5
        priority: 75
      # Proximity Stop (paper 2, sec 3.1): a human in the collaboration zone
      # must zero commanded velocity regardless of source, same character as
      # ISO/TS 15066's Safety-rated Monitored Stop - so it has to outrank
      # every ordinary command source (avoidance/teleop/nav), not just
      # navigation. Sits below block_all only because Payload Interaction's
      # hard stop (sec 3.3) is explicitly defined to take precedence over
      # everything else, including this one.
      proximity_stop:
        topic   : cmd_vel_proximity_stop
        timeout : 0.5
        priority: 220

